{% extends 'base.html' %}

{% block content %}
  <h1>{{ title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button class="button" type="submit">{{ submit_label }}</button>
      {% if product %}
        <a class="button secondary" href="{% url 'store:product_detail' product.slug %}">Cancel</a>
      {% else %}
        <a class="button secondary" href="{% url 'store:home' %}">Cancel</a>
      {% endif %}
    </div>
  </form>
{% endblock %}
