{% extends 'base.html' %}

{% block content %}
  <h1>{{ user.username }}</h1>
  <p>Email: {{ user.email|default:'-' }}</p>
  <p>First name: {{ user.first_name|default:'-' }}</p>
  <p>Last name: {{ user.last_name|default:'-' }}</p>
  <p>Date joined: {{ user.date_joined }}</p>
  <div class="actions">
    <a class="button secondary" href="{% url 'users:profile_update' %}">Edit profile</a>
  </div>
{% endblock %}
