{% extends 'base.html' %}

{% block content %}
  <h1>Edit Profile</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button class="button" type="submit">Save changes</button>
      <a class="button secondary" href="{% url 'users:profile' %}">Cancel</a>
    </div>
  </form>
{% endblock %}
