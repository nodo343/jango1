{% extends 'base.html' %}

{% block content %}
  <h1>{{ product.name }} {% if product.has_discount %}<span class="sale-badge">SALE</span>{% endif %}</h1>
  <p>{{ product.description }}</p>
  <p>Price: {{ product.get_display_price }}</p>
  <p>Category: <a href="/category/{{ product.category.slug }}/">{{ product.category.name }}</a></p>
{% endblock %}
