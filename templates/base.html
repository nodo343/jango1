<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple Shop</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
      header { background:#333; color:#fff; padding:10px 20px; }
      nav a { color:#fff; margin-right:15px; text-decoration:none }
      .container { display:flex; gap:20px; padding:20px }
      .sidebar { width:220px }
      .content { flex:1 }
      .product { border:1px solid #eee; padding:10px; margin-bottom:10px }
      .product-filters { display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px; margin:0 0 20px; padding:14px; background:#f5f5f5; border:1px solid #e0e0e0; }
      .product-filters .filter-field { min-width:160px; flex:1; }
      .product-filters .search-field { min-width:220px; flex:2; }
      .product-filters .filter-check { display:flex; align-items:center; gap:6px; padding-bottom:8px; }
      .product-filters .filter-check label { margin:0; }
      .product-filters .filter-actions { display:flex; gap:8px; }
      .sale-badge { color:#fff; background:#e74c3c; padding:3px 6px; border-radius:3px; font-weight:bold }
      .old-price { color:#666; }
      .actions { display:flex; gap:10px; margin:10px 0; }
      .button { background:#333; color:#fff; border:0; padding:8px 12px; text-decoration:none; cursor:pointer; display:inline-block; }
      .button.secondary { background:#666; }
      .button.danger { background:#c0392b; }
      form p { margin-bottom:14px; }
      label { display:block; font-weight:bold; margin-bottom:4px; }
      input, select, textarea { box-sizing:border-box; max-width:520px; width:100%; padding:8px; }
      input[type="checkbox"] { width:auto; }
      .errorlist { color:#c0392b; }
    </style>
  </head>
  <body>
    <header>
      {% include 'includes/navigation.html' %}
    </header>
    <div class="container">
      {% include 'includes/sidebar.html' %}
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
